  th: "จำเป็นต้องได้รับอนุญาตใช้งานพื้นที่จัดเก็บเพื่อเลือกรูปภาพ โปรดเปิดใช้งานในการตั้งค่าแอป"
  it: "L'autorizzazione di archiviazione è richiesta per selezionare le immagini. Si prega di abilitarla nelle impostazioni dell'app."
  de: "Die Speicherberechtigung ist erforderlich, um Bilder auszuwählen. Bitte in den App-Einstellungen aktivieren."
  ru: "Разрешение на доступ к хранилищу требуется для выбора изображений. Пожалуйста, включите его в настройках приложения."
  uk: "Дозвіл на сховище потрібен для вибору зображень. Будь ласка, увімкніть його в налаштуваннях програми."
