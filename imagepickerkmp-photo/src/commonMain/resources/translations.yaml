gallery_permission_description:
  fr: "L'accès au stockage est requis pour sélectionner des images de votre galerie. Veuillez accorder l'autorisation."
  en: "Access to storage is required to select images from your gallery. Please grant the permission."
  es: "Se requiere acceso al almacenamiento para seleccionar imágenes de tu galería. Por favor, otorga el permiso."
  zh: "从相册中选择图片需要访问存储空间。请授予权限。"
  ko: "갤러리에서 이미지를 선택하려면 저장공간 접근 권한이 필요합니다. 권한을 허용해 주세요."
  ja: "ギャラリーから画像を選択するには、ストレージへのアクセス権が必要です。権限を許可してください。"
  hi: "आपकी गैलरी से चित्र चुनने के लिए स्टोरेज तक पहुंच आवश्यक है। कृपया अनुमति दें।"
  th: "จำเป็นต้องเข้าถึงพื้นที่จัดเก็บเพื่อเลือกรูปภาพจากแกลเลอรีของคุณ โปรดอนุญาต"
  it: "L'accesso alla memoria è richiesto per selezionare le immagini dalla galleria. Si prega di concedere il permesso."
  de: "Der Zugriff auf den Speicher ist erforderlich, um Bilder aus Ihrer Galerie auszuwählen. Bitte erteilen Sie die Berechtigung."
  ru: "Доступ к хранилищу требуется для выбора изображений из галереи. Пожалуйста, предоставьте разрешение."
  uk: "Доступ до сховища потрібен для вибору зображень із галереї. Будь ласка, надайте дозвіл."
  pl: "Uprawnienia do przechowywania danych są wymagane do wybierania zdjęć z galerii. Proszę przyznać uprawnienia"
  nl: "Toegang tot de galerij is nodig om afbeeldingen te selecteren. Verleen a.u.b. toestemming."


