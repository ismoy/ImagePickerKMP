camera_permission_description:
  fr: "L'autorisation de la caméra est requise pour prendre des photos. Veuillez l'accorder dans les paramètres."
  en: "Camera permission is required to capture photos. Please grant it in settings"
  es: "Se requiere el permiso de la cámara para capturar fotos. Por favor, otórgalo en la configuración."
  zh: "拍摄照片需要相机权限。请在设置中授予。"
  ko: "사진을 촬영하려면 카메라 권한이 필요합니다. 설정에서 권한을 허용해 주세요."
  ja: "写真を撮影するにはカメラの権限が必要です。設定から許可してください。"
  hi: "फ़ोटो कैप्चर करने के लिए कैमरा अनुमति आवश्यक है। कृपया सेटिंग्स में इसकी अनुमति दें"
  th: "จำเป็นต้องได้รับอนุญาตใช้งานกล้องเพื่อถ่ายภาพ โปรดอนุญาตในการตั้งค่า"
  it: "L'autorizzazione della fotocamera è richiesta per scattare foto. Si preга di concederla nelle impostazioni."
  de: "Die Kameraberechtigung ist erforderlich, um Fotos aufzunehmen. Bitte in den Einstellungen aktivieren."
  ru: "Разрешение на использование камеры требуется для съемки фотографий. Пожалуйста, предоставьте его в настройках."
  uk: "Дозвіл на камеру потрібен для зйомки фотографій. Будь ласка, надайте його в налаштуваннях."
  pl: "Uprawnienia aparatu są wymagane do robienia zdjęć. Proszę je przyznać w ustawieniach"
  nl: "Cameratoestemming is nodig om foto's te maken. Activeer dit in Instellingen."


