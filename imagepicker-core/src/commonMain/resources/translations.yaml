camera_mic_permission_description:
  fr: "Les autorisations de la caméra et du microphone sont requises pour enregistrer des vidéos. Veuillez les accorder dans les paramètres."
  en: "Camera and microphone permissions are required to record video. Please grant them in settings."
  es: "Se requieren los permisos de cámara y micrófono para grabar video. Por favor, otórgalos en la configuración."
  zh: "录制视频需要相机和麦克风权限。请在设置中授予。"
  ko: "동영상을 녹화하려면 카메라 및 마이크 권한이 필요합니다. 설정에서 권한을 허용해 주세요."
  ja: "動画を録画するにはカメラとマイクの権限が必要です。設定から許可してください。"
  hi: "वीडियो रिकॉर्ड करने के लिए कैमरा और माइक्रोफ़ोन अनुमति आवश्यक है। कृपया सेटिंग्स में इसकी अनुमति दें।"
  th: "จำเป็นต้องได้รับอนุญาตใช้งานกล้องและไมโครโฟนเพื่อบันทึกวิดีโอ โปรดอนุญาตในการตั้งค่า"
  it: "Le autorizzazioni della fotocamera e del microfono sono richieste per registrare video. Si prega di concederle nelle impostazioni."
  de: "Kamera- und Mikrofonberechtigungen sind erforderlich, um Videos aufzunehmen. Bitte in den Einstellungen aktivieren."
  ru: "Для записи видео требуются разрешения на использование камеры и микрофона. Пожалуйста, предоставьте их в настройках."
  uk: "Для запису відео потрібні дозволи на камеру та мікрофон. Будь ласка, надайте їх у налаштуваннях."
  pl: "Uprawnienia kamery i mikrofonu są niezbędne do nagrywania filmów. Proszę je przyznać w ustawieniach"
  nl: "Microfoon- en cameratoestemming is nodig om video's op te nemen. Activeer deze in Instellingen."

camera_mic_permission_denied_description:
  fr: "Les autorisations de la caméra et du microphone sont requises pour enregistrer des vidéos. Veuillez accorder les autorisations."
