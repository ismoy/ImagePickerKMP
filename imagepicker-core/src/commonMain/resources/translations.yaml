  th: "จำเป็นต้องได้รับอนุญาตใช้งานกล้องและไมโครโฟนเพื่อบันทึกวิดีโอ โปรดให้สิทธิ์การเข้าถึง"
  it: "Le autorizzazioni della fotocamera e del microfono sono richieste per registrare video. Si prega di concedere i permessi."
