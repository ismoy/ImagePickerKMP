gallery_permission_denied_description:
  fr: "L'autorisation de stockage est requise pour sélectionner des images. Veuillez l'activer dans les paramètres de l'application."
  en: "Storage permission is required to select images. Please enable it in app settings."
  es: "Se requiere el permiso de almacenamiento para seleccionar imágenes. Por favor, actívalo en la configuración de la aplicación."
  zh: "选择图片需要存储权限。请在应用设置中启用它。"
  ko: "이미지를 선택하려면 저장공간 권한이 필요합니다. 앱 설정에서 활성화해 주세요."
  ja: "画像を選択するにはストレージの権限が必要です。アプリの設定から有効にしてください。"
  hi: "चित्र चुनने के लिए स्टोरेज अनुमति आवश्यक है। कृपया इसे ऐप सेटिंग्स में सक्षम करें।"
  th: "จำเป็นต้องได้รับอนุญาตใช้งานพื้นที่จัดเก็บเพื่อเลือกรูปภาพ โปรดเปิดใช้งานในการตั้งค่าแอป"
  it: "L'autorizzazione di archiviazione è richiesta per selezionare le immagini. Si prega di abilitarla nelle impostazioni dell'app."
  de: "Die Speicherberechtigung ist erforderlich, um Bilder auszuwählen. Bitte in den App-Einstellungen aktivieren."
  ru: "Разрешение на доступ к хранилищу требуется для выбора изображений. Пожалуйста, включите его в настройках приложения."
  uk: "Дозвіл на сховище потрібен для вибору зображень. Будь ласка, увімкніть його в налаштуваннях програми."
  pl: "Uprawnienia do przechowywania danych są wymagane do wybierania zdjęć z galerii. Proszę je przyznać w ustawieniach"
  nl: "Toegang tot de galerij is nodig om afbeeldingen te selecteren. Activeer dit in Instellingen."

