  nl: "Cameratoestemming vereist"

camera_permission_description:
  fr: "L'autorisation de la caméra est requise pour prendre des photos. Veuillez l'accorder dans les paramètres."
  en: "Camera permission is required to capture photos. Please grant it in settings"
  es: "Se requiere el permiso de la cámara para capturar fotos. Por favor, otórgalo en la configuración."
  zh: "拍摄照片需要相机权限。请在设置中授予。"
  ko: "사진을 촬영하려면 카메라 권한이 필요합니다. 설정에서 권한을 허용해 주세요."
  ja: "写真を撮影するにはカメラの権限が必要です。設定から許可してください。"
  hi: "फ़ोटो कैप्चर करने के लिए कैमरा अनुमति आवश्यक है। कृपया सेटिंग्स में इसकी अनुमति दें"
  th: "จำเป็นต้องได้รับอนุญาตใช้งานกล้องเพื่อถ่ายภาพ โปรดอนุญาตในการตั้งค่า"
  it: "L'autorizzazione della fotocamera è richiesta per scattare foto. Si preга di concederla nelle impostazioni."
  de: "Die Kameraberechtigung ist erforderlich, um Fotos aufzunehmen. Bitte in den Einstellungen aktivieren."
  ru: "Разрешение на использование камеры требуется для съемки фотографий. Пожалуйста, предоставьте его в настройках."
  uk: "Дозвіл на камеру потрібен для зйомки фотографій. Будь ласка, надайте його в налаштуваннях."
  pl: "Uprawnienia aparatu są wymagane do robienia zdjęć. Proszę je przyznać w ustawieniach"
  nl: "Cameratoestemming is nodig om foto's te maken. Activeer dit in Instellingen."

camera_permission_scanner_description:
  fr: "L'autorisation de la caméra est requise pour scanner les codes QR et les codes-barres. Veuillez l'accorder dans les paramètres."
  en: "Camera permission is required to scan QR codes and barcodes. Please grant it in settings."
  es: "Se requiere el permiso de la cámara para escanear códigos QR y de barras. Por favor, otórgalo en la configuración."
  zh: "扫描二维码和条形码需要相机权限。请在设置中授予。"
  ko: "QR 코드와 바코드를 스캔하려면 카메라 권한이 필요합니다. 설정에서 권한을 허용해 주세요."
  ja: "QRコードとバーコードをスキャンするにはカメラの権限が必要です。設定から許可してください。"
  hi: "QR कोड और बारकोड स्कैन करने के लिए कैमरा अनुमति आवश्यक है। कृपया सेटिंग्स में इसकी अनुमति दें।"
  th: "จำเป็นต้องได้รับอนุญาตใช้งานกล้องเพื่อสแกนคิวอาร์โค้ดและบาร์โค้ด โปรดอนุญาตในการตั้งค่า"
  it: "L'autorizzazione della fotocamera è richiesta per scansionare codici QR e codici a barre. Si prega di concederla nelle impostazioni."
  de: "Die Kameraberechtigung ist erforderlich, um QR-Codes und Barcodes zu scannen. Bitte in den Einstellungen aktivieren."
  ru: "Разрешение на использование камеры требуется для сканирования QR-кодов и штрихкодов. Пожалуйста, предоставьте его в настройках."
  uk: "Дозвіл на використання камери потрібен для сканування QR-кодів та штрих-кодів. Будь ласка, надайте його в налаштуваннях."
  pl: "Uprawnienia aparatu są wymagane do skanowania kodów QR i kodów kreskowych. Proszę je przyznać w ustawieniach"
  nl: "Cameratoestemming is nodig om QR-codes en barcodes te scannen. Activeer dit in Instellingen."

