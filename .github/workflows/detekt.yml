name: Detekt

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Run Detekt
        id: detekt_run
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: Count Detekt issues
        id: detekt_issues
        shell: bash
        run: |
          ISSUES=0
          for REPORT in \
            imagepicker-core/build/reports/detekt/detekt.xml \
            imagepickerkmp-photo/build/reports/detekt/detekt.xml \
            imagepickerkmp-video/build/reports/detekt/detekt.xml \
            imagepickerkmp-audio/build/reports/detekt/detekt.xml \
            imagepickerkmp-audio-player/build/reports/detekt/detekt.xml \
            imagepickerkmp-scanner/build/reports/detekt/detekt.xml \
            imagepickerkmp-video-player/build/reports/detekt/detekt.xml; do
            if [ -f "$REPORT" ]; then
              COUNT=$(grep -c '<error ' "$REPORT" 2>/dev/null || true)
              [[ "$COUNT" =~ ^[0-9]+$ ]] && ISSUES=$((ISSUES + COUNT))
            fi
          done
          echo "issues=${ISSUES}" >> "$GITHUB_OUTPUT"

      - name: Notify Discord on Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ **Detekt Passed** — ImagePickerKMP\n**Branch:** \`${{ github.ref_name }}\`\n**Author:** ${{ github.actor }}\n**Issues found:** ${{ steps.detekt_issues.outputs.issues }}\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Notify Discord on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ **Detekt Failed** — ImagePickerKMP\n**Branch:** \`${{ github.ref_name }}\`\n**Author:** ${{ github.actor }}\n**Issues found:** ${{ steps.detekt_issues.outputs.issues }}\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
