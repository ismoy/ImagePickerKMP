name: Auto Release Modules

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect and create missing releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List of modules to scan in the format "directory:prefix"
          MODULES="imagepicker-core:core imagepickerkmp-photo:photo imagepickerkmp-video:video imagepickerkmp-audio:audio imagepickerkmp-audio-player:audio-player imagepickerkmp-scanner:scanner imagepickerkmp-video-player:video-player"
          
          for entry in $MODULES; do
            DIR="${entry%%:*}"
            PREFIX="${entry##*:}"
            
            # Skip if the module directory does not exist
            if [ ! -d "$DIR" ]; then
              echo "Directory $DIR not found, skipping..."
              continue
            fi
            
            echo "Checking version for $DIR..."
            
            # Extract version directly from the mavenPublishing block in build.gradle.kts
            # This handles hardcoded versions per-module instead of global project properties
            VERSION=$(grep -A 10 "mavenPublishing" "$DIR/build.gradle.kts" | grep "version\s*=" | head -n 1 | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/')
            
            if [ -z "$VERSION" ] || [ "$VERSION" == "unspecified" ]; then
              echo "Could not determine version for $DIR. Skipping."
              continue
            fi
            
            TAG="${PREFIX}/v${VERSION}"
            echo "Module $DIR is at version $VERSION. Expected tag: $TAG"
            
            # Check if the tag already exists in the remote repository
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists on remote. No new release needed."
            else
              echo "Tag $TAG does not exist. Creating new release..."
              
              # Automatically create the tag and release on GitHub
              # Using --target ensures we tag the exact commit that triggered the workflow
              gh release create "$TAG" \
                --target $GITHUB_SHA \
                --title "${DIR} v${VERSION}" \
                --generate-notes
                
              echo "Successfully created release for $TAG"
            fi
            echo "----------------------------------------"
          done
